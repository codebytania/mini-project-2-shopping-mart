<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Mart</title>

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar">
      <div class="logo">🛒 Shopping Mart</div>

      <div class="nav-actions">
        <button id="themeBtn">🌙</button>

        <button id="wishlistBtn">❤️ <span id="wishlistCount">0</span></button>

        <button id="cartBtn">🛒 <span id="cartCount">0</span></button>
      </div>
    </nav>

    <!-- Hero -->

    <section class="hero">
      <h1>Welcome to Shopping Mart</h1>

      <p>Discover amazing products at the best prices.</p>
    </section>

    <!-- Search & Filter -->

    <section class="controls">
      <input type="text" id="searchInput" placeholder="🔎 Search products..." />

      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="beauty">Beauty</option>
        <option value="home">Home</option>
      </select>
    </section>

    <!-- Products -->

    <main class="products" id="productsContainer"></main>

    <!-- Cart Sidebar -->

    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2>🛒 Your Cart</h2>

        <button id="closeCart">✕</button>
      </div>

      <div id="cartItems"></div>

      <div class="cart-footer">
        <h3>Total: $<span id="cartTotal">0.00</span></h3>

        <button id="checkoutBtn">Place Order</button>
      </div>
    </aside>

    <!-- Overlay -->

    <div class="overlay" id="overlay"></div>

    <!-- Toast -->

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
